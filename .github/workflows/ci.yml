name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test runtime diagnostics
        run: python3 -m unittest discover -s tests -v
      - name: Build skills and verify license notices
        run: |
          python3 tools/pstack_opencodex.py build
          cmp LICENSE dist/LICENSE
          cmp upstream/LICENSE dist/LICENSE.pstack
      - name: Check whitespace and upstream preservation
        run: |
          git diff --check
          git diff --exit-code -- upstream/
